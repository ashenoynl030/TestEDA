<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TestEDA Application</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e0e0e0;
    }

    .container {
      text-align: center;
      padding: 3rem 2rem;
      max-width: 600px;
    }

    .logo {
      font-size: 4rem;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      color: #e94560;
      margin-bottom: 0.5rem;
      letter-spacing: 2px;
    }

    .subtitle {
      font-size: 1.1rem;
      color: #a0aec0;
      margin-bottom: 2.5rem;
    }

    .badge {
      display: inline-block;
      background: #e94560;
      color: white;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 2rem;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 2rem;
      backdrop-filter: blur(10px);
      margin-bottom: 2rem;
    }

    .card p {
      font-size: 1rem;
      line-height: 1.7;
      color: #cbd5e0;
    }

    .github-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #e94560;
      color: white;
      text-decoration: none;
      padding: 0.75rem 1.75rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      transition: background 0.2s, transform 0.1s;
    }

    .github-link:hover {
      background: #c73652;
      transform: translateY(-1px);
    }

    .footer {
      margin-top: 2.5rem;
      font-size: 0.85rem;
      color: #4a5568;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">⚡</div>
    <h1>TestEDA</h1>
    <p class="subtitle">Event-Driven Application</p>
    <span class="badge">Live</span>

    <div class="card">
      <p>
        Welcome to <strong>TestEDA</strong>! This application is hosted via
        GitHub Pages and is publicly accessible at the link below. Explore the
        repository to learn more about the project.
      </p>
    </div>

    <a
      class="github-link"
      href="https://github.com/ashenoynl030/TestEDA"
      target="_blank"
      rel="noopener noreferrer"
    >
      &#128279; View on GitHub
    </a>

    <p class="footer">Deployed with GitHub Pages &bull; ashenoynl030/TestEDA</p>
  </div>
</body>
</html>
